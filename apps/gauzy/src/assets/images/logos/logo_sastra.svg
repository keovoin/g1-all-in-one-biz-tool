<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<defs>
		<radialGradient id="bg" cx="0.5" cy="0.46" r="0.72">
			<stop offset="0" stop-color="#0b0b0b"/>
			<stop offset="1" stop-color="#000000"/>
		</radialGradient>
		<linearGradient id="gold" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="#a87b2e"/>
			<stop offset="0.5" stop-color="#e8c06a"/>
			<stop offset="1" stop-color="#f7e3a1"/>
		</linearGradient>
		<radialGradient id="cyanhalo" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
			<stop offset="0.18" stop-color="#7ff4ff" stop-opacity="0.8"/>
			<stop offset="0.45" stop-color="#00c2d4" stop-opacity="0.35"/>
			<stop offset="1" stop-color="#00a8b5" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#e8c06a" stop-opacity="0"/>
			<stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
			<stop offset="1" stop-color="#e8c06a" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="streakV" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#7ff4ff" stop-opacity="0"/>
			<stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
			<stop offset="1" stop-color="#7ff4ff" stop-opacity="0"/>
		</linearGradient>
		<!-- one petal, base at (0,0), tip up at (0,-190); circuit double-line -->
		<g id="pet">
			<path d="M0,0 C -26,-38 -30,-118 0,-190 C 30,-118 26,-38 0,0 Z"
			      fill="none" stroke="url(#gold)" stroke-width="3" vector-effect="non-scaling-stroke"/>
			<path d="M0,-14 C -19,-42 -22,-112 0,-172 C 22,-112 19,-42 0,-14 Z"
			      fill="none" stroke="url(#gold)" stroke-width="1.6" opacity="0.75" vector-effect="non-scaling-stroke"/>
			<path d="M0,-20 L0,-150" stroke="url(#gold)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
			<path d="M0,-70 L-11,-81 L-11,-118" fill="none" stroke="url(#gold)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
			<circle cx="0" cy="-150" r="3.4" fill="#f7e3a1"/>
			<circle cx="-11" cy="-118" r="3" fill="#e8c06a"/>
			<circle cx="0" cy="-176" r="2.6" fill="#f7e3a1"/>
		</g>
		<!-- open chevron petal (upper diagonals) -->
		<g id="chev">
			<path d="M-6,0 L-30,-120 L0,-190 L30,-120 L6,0"
			      fill="none" stroke="url(#gold)" stroke-width="3" vector-effect="non-scaling-stroke"/>
			<path d="M-1,-16 L-21,-116 L0,-172 L21,-116 L1,-16"
			      fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.75" vector-effect="non-scaling-stroke"/>
			<path d="M0,-24 L0,-150" stroke="url(#gold)" stroke-width="1.3" vector-effect="non-scaling-stroke"/>
			<circle cx="0" cy="-150" r="3.2" fill="#f7e3a1"/>
			<circle cx="-21" cy="-116" r="2.8" fill="#e8c06a"/>
			<circle cx="21" cy="-116" r="2.8" fill="#e8c06a"/>
		</g>
	</defs>

	<rect width="512" height="512" rx="104" fill="url(#bg)"/>

	<!-- downward radiating traces + open-ring pads -->
	<g stroke="url(#gold)" stroke-width="1.4" fill="none" opacity="0.7">
		<path d="M256,300 L256,430"/>
		<path d="M256,320 L200,376 L200,420"/>
		<path d="M256,320 L312,376 L312,420"/>
		<path d="M256,340 L160,396 L160,432"/>
		<path d="M256,340 L352,396 L352,432"/>
	</g>
	<g fill="none" stroke="#e8c06a" stroke-width="1.6" opacity="0.8">
		<circle cx="256" cy="442" r="6"/>
		<circle cx="200" cy="432" r="5"/>
		<circle cx="312" cy="432" r="5"/>
		<circle cx="160" cy="444" r="4.5"/>
		<circle cx="352" cy="444" r="4.5"/>
	</g>

	<!-- lotus: 7 petals from base (256,300) -->
	<g transform="translate(256,300)">
		<use href="#pet"  transform="rotate(82) scale(0.52)"/>
		<use href="#pet"  transform="rotate(-82) scale(0.52)"/>
		<use href="#chev" transform="rotate(52) scale(0.66)"/>
		<use href="#chev" transform="rotate(-52) scale(0.66)"/>
		<use href="#pet"  transform="rotate(26) scale(0.82)"/>
		<use href="#pet"  transform="rotate(-26) scale(0.82)"/>
		<use href="#pet"  transform="scale(1)"/>
	</g>

	<!-- cyan energy core (anamorphic flare) on top -->
	<circle cx="256" cy="300" r="120" fill="url(#cyanhalo)"/>
	<rect x="96" y="296" width="320" height="8" rx="4" fill="url(#streak)"/>
	<rect x="252" y="232" width="8" height="136" rx="4" fill="url(#streakV)"/>
	<circle cx="256" cy="300" r="7" fill="#ffffff"/>
</svg>
