<div class="term_and_condition">
	<header class="legal-doc__header" *ngIf="terms">
		<h1 class="legal-doc__title">{{ terms.title }}</h1>
		<p class="legal-doc__meta">
			<span class="legal-doc__product">{{ terms.productName }}</span>
			<span class="legal-doc__separator" aria-hidden="true">&middot;</span>
			<span class="legal-doc__version">{{
				'LEGAL.DOCUMENT_VERSION' | translate: { version: terms.version }
			}}</span>
			<span class="legal-doc__separator" aria-hidden="true">&middot;</span>
			<span class="legal-doc__effective-date">
				{{ 'LEGAL.DOCUMENT_EFFECTIVE_DATE' | translate: { date: terms.effectiveDate } }}
			</span>
		</p>
	</header>
	<div class="legal-doc__body" [innerHtml]="term_and_policy"></div>
</div>
