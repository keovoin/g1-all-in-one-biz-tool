<div class="container">
  <input
    #autoInput
    nbInput
    type="text"
    [formControl]="searchControl"
    placeholder="Add candidate"
    [nbAutocomplete]="auto"
    />

    <nb-autocomplete #auto (selectedChange)="onCandidateSelected($event)">
      @for (candidate of filteredCandidates$ | async; track candidate) {
        <nb-option [value]="candidate.id">
          <ngx-avatar
            size="sm"
            [src]="candidate.user?.imageUrl"
            [name]="candidate.user?.name"
            [isOption]="true"
          ></ngx-avatar>
        </nb-option>
      }
    </nb-autocomplete>

    <nb-checkbox [(ngModel)]="showRejected" class="checkbox" (ngModelChange)="toggleShowRejected()">
      {{ 'CANDIDATES_PAGE.SHOW_REJECTED' | translate }}
    </nb-checkbox>
  </div>
