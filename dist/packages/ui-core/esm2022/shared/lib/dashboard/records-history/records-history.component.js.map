<nb-card
  class="records"
  [class.inline]="!isDialog"
  [nbSpinner]="loading"
  nbSpinnerStatus="primary"
  nbSpinnerSize="large"
>
  <nb-card-header>
    <!-- Rendered only as a dialog: inline (dashboard widget) there is nothing to close. -->
    @if (isDialog) {
      <span class="cancel"><i class="fas fa-times close" (click)="close()"></i></span>
    }
    <h5 class="title">{{ translatedType | titlecase }}</h5>
  </nb-card-header>
  <nb-card-body>
    <div class="table-scroll-container">
      <angular2-smart-table
        [class.ga-table-loading]="loading"
        style="cursor: pointer"
        [settings]="smartTableSettings"
        [source]="smartTableSource"
      ></angular2-smart-table>
    </div>
    <div class="pagination-container">
      @if (smartTableSource) {
        <ngx-pagination [source]="smartTableSource"></ngx-pagination>
      }
    </div>
  </nb-card-body>
</nb-card>
