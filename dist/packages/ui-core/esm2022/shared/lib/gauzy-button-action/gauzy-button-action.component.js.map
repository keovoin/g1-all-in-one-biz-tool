<div class="actions-container">
	<!-- Kept on ONE line: the empty-slot rule below relies on :empty, which any
		template whitespace text node would defeat. -->
	<span class="visible-slot"><ng-content select="[buttonTemplateVisible]" /><ng-container [ngTemplateOutlet]="buttonTemplateVisible()" /></span>
	<!--
		The selection actions collapse to ZERO layout width while disabled. The old
		treatment slid them away with translateX + overflow hidden, which removed
		them from view but NOT from layout: the block kept the full strip's width,
		so on pages with wide action sets it could never fit beside the page title
		and wrapped onto its own line, with the visible button stranded mid-page.
	-->
	<div class="actions-slide" [class.open]="!isDisable()" [attr.aria-hidden]="isDisable()">
		<div class="actions-slide-inner">
			<ng-container [ngTemplateOutlet]="buttonTemplate()" />
			<ng-content select="[buttonTemplate]" />
		</div>
	</div>
	@if (hasLayoutSelector()) {
		<ga-layout-selector [componentName]="componentName()" />
	}
</div>
