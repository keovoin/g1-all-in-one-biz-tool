<ng-select
  #select
  [addTag]="(hasEditEmployee$ | async) && addTag ? createNew : null"
  [clearable]="isClearable()"
  [disabled]="disabled"
  [(items)]="employees"
  (change)="selectEmployee($event); select.blur()"
  (clear)="select.blur()"
  [(ngModel)]="selectedEmployee"
  [placeholder]="placeholder || 'FORM.PLACEHOLDERS.ALL_EMPLOYEES' | translate"
  [addTagText]="'FORM.PLACEHOLDERS.ADD_EMPLOYEE' | translate"
  [searchFn]="searchEmployee"
  bindName="firstName"
  appendTo="body"
  class="employee gauzy-entity-select"
  [ngClass]="panelClass"
  >
  <ng-template ng-option-tmp let-item="item" let-index="index">
    @if (item.imageUrl && !item.imageUrl.includes('avatar-default')) {
      <img [src]="item.imageUrl" width="20" height="20" alt="" />
    } @else if (item.id) {
      <nb-icon class="avatar-fallback" icon="person-outline"></nb-icon>
    }
    <span [title]="getFullName(item)">{{ getShortenedName(item.firstName, item.lastName, 42) }}</span>
  </ng-template>
  <ng-template ng-label-tmp let-item="item">
    <div class="selector-template" [title]="getFullName(item)">
      @if (item.imageUrl && !item.imageUrl.includes('avatar-default')) {
        <img height="20" width="20" [src]="item.imageUrl" alt="" />
      } @else if (item.id) {
        <nb-icon class="avatar-fallback" icon="person-outline"></nb-icon>
      }
      <span>{{ getFullName(item) }}</span>
    </div>
  </ng-template>
</ng-select>
