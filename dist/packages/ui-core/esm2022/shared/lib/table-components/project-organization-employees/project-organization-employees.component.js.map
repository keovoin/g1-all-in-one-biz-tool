@if (rowData?.members?.length > 0) {
	<div class="members">
		<div class="members-title">
			{{ 'ORGANIZATIONS_PAGE.EDIT.MEMBERS' | translate }}
		</div>
		<!--
			Same people treatment as the grid columns, only allowed to wrap and to
			name more people, because a card has the room a table cell does not.
		-->
		<ngx-people-list
			[people]="rowData.members"
			[maxNames]="6"
			[maxAvatars]="6"
			[wrap]="true"
			(selectPerson)="edit($event)"
		></ngx-people-list>
	</div>
}
