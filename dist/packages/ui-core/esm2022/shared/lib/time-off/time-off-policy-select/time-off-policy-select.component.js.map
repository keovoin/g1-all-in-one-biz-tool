<div class="form-group">
  <label class="label" [attr.for]="id">
    {{ 'TIME_OFF_PAGE.POLICY.POLICY' | translate }}
  </label>
  <nb-select
    [formControl]="ctrl"
    fullWidth
    [placeholder]="placeholder || 'TIME_OFF_PAGE.SELECT_TIME_OFF_POLICY' | translate"
    [attr.id]="id"
    (selectedChange)="onSelectedChange($event)"
    [(ngModel)]="policyId"
		[status]="
			ctrl.invalid && (ctrl.touched || ctrl.dirty)
				? 'danger' 
				: 'basic'"
    >
    @for (policy of policies; track policy) {
      <nb-option
        [value]="policy.id"
        >
        {{ policy?.name }}
      </nb-option>
    }
  </nb-select>
</div>
